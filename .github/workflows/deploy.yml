name: Deploy FE Mevi Factory

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kết nối SSH và chạy kịch bản Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 234
          script_stop: true
          script: |
            set -e
            cd /data/MeviFactory-FE
            
            # 1. Reset file lock về bản gốc để không bị kẹt khi pull code
            git checkout -- yarn.lock
            git pull origin main
            
            # 2. Nạp token xác thực
            export $(grep NPM_AUTH_TOKEN .env)
            
            # 3. Dọn dẹp thư mục cũ
            rm -rf node_modules
            yarn cache clean
            
            # 4. Cài đặt thư viện 
            yarn install
            
            # 5. Build mã nguồn
            yarn build
